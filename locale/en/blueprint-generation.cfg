error-no-item=Choose the item you want to produce first.
error-bad-rate=Enter a rate greater than zero.
error-no-cursor=A blueprint cannot be placed on your cursor right now.
error-cursor-full=Your cursor item could not be put away. Make room in your inventory and try again.
error-unsupported-item=That item is not supported yet. Pick one of the items the item picker offers.
error-unsupported-recipe=The recipe for that item is not shaped the way this generator expects, so it cannot be generated.
error-missing-prototype=Something this blueprint needs (a recipe or a building) does not exist in the current game, so it cannot be generated.
error-locked=You have not unlocked the recipe for __1__ yet, and this blueprint needs it.
error-unsupported-machine=The machine for that item has a size this generator cannot lay out yet, so it cannot be generated.
error-unsupported-energy=This mod only handles machines that run on electricity or burn fuel; the machine for this item runs on something else (heat or fluid, say).
error-fuel-mismatch=The fuel set for __1__ in this mod's config does not match what that machine burns. Please report this.
error-rate-too-high=That rate needs more than one belt lane can carry. The most one blueprint can make right now is __1__ per minute.
error-no-recipe=No recipe that this mod can build in one of its machines makes __1__, so it cannot be generated.
error-ambiguous-recipe=More than one recipe makes __1__, and this mod cannot choose between them yet, so it cannot be generated.
error-chain-too-complex=Making __1__ needs a step this mod cannot build yet: one with more than four ingredients that are themselves made, one with made ingredients and more than four ingredients in all or more than one raw one, or one made ingredient that itself comes from two or more inputs.
error-chain-fuel=__1__ is made in a machine that burns fuel, but only the first step of each branch can take fuel (the fuel travels on the belt of raw items), so it cannot be generated.
error-fuel-needs-inputs=__1__ is made in a furnace that is fed by another step and needs fuel, which only the blueprint that brings in one belt of each material can supply. Research the splitter and the underground belt to generate it.
