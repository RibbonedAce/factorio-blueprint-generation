[blueprint-generation]
shortcut-name=Generate blueprint
window-title=Blueprint generation
item-label=Item or fluid to produce
rate-label=Rate (items, or units of a fluid, per minute)
max-rate=Max: __1__
max-rate-no-item=Max: choose an item
generate=Generate
close=Close
error-no-item=Choose the item you want to produce first.
error-bad-rate=Enter a rate greater than zero.
error-no-cursor=A blueprint cannot be placed on your cursor right now.
error-cursor-full=Your cursor item could not be put away. Make room in your inventory and try again.
error-unsupported-item=That item is not supported yet. Pick one of the items the item picker offers.
error-unsupported-recipe=The recipe for that item is not shaped the way this generator expects, so it cannot be generated.
error-missing-prototype=Something this blueprint needs (a recipe or a building) does not exist in the current game, so it cannot be generated.
error-locked=You have not unlocked the recipe for __1__ yet, and this blueprint needs it.
error-unsupported-machine=The machine for that item has a size this generator cannot lay out yet, so it cannot be generated.
error-unsupported-energy=This mod only handles machines that run on electricity or burn fuel; the machine for this item runs on something else (heat or fluid, say).
error-fuel-mismatch=The fuel set for __1__ in this mod's config does not match what that machine burns. Please report this.
error-rate-too-high=That rate needs more than one belt lane can carry. The most one blueprint can make right now is __1__ per minute.
error-no-recipe=No recipe that this mod can build in one of its machines makes __1__, so it cannot be generated.
error-ambiguous-recipe=More than one recipe makes __1__, and this mod cannot choose between them yet, so it cannot be generated.
error-chain-too-complex=Making __1__ needs a step this mod cannot build yet: one with more than six ingredients that are themselves made, one with made ingredients and more than six ingredients in all or more than one raw one, or one made ingredient, next to a raw one, that itself comes from two or more inputs.
error-belts-need-weave=__1__ is made from more ingredients than two belts carry, so its machines take them from three woven belts, which need the splitter, the underground belt and the medium electric pole. Research them to generate it.
error-fluid-single-input=__1__ needs a fluid, which this mod can bring only to a step that takes two or more ingredients from other steps or belts. It cannot be generated yet.
error-fluid-unsupported=__1__ needs a fluid in a way this mod cannot build yet: its recipe takes more than one fluid or more than four items, or its machine is not a 3 x 3 machine with a fluid input.
error-fluid-needs-weave=__1__ needs a fluid and more than two items, so its machines take the items from two woven belts, which need the splitter and the underground belt. Research them to generate it.
error-fluid-row-recipe=__1__ is made from a fluid in a way this mod cannot lay out yet: its recipe has to take one fluid and nothing else, and make nothing but __1__.
error-fluid-row-pipes=__1__ is made in a machine whose pipes this mod cannot lay out yet: the connections of what the machine takes have to be in one row along one side of it, and those of what it gives in one row along the opposite side.
error-fluid-row-poles=__1__ is made in a row of machines that this mod cannot power with the pole it has: the pole has to reach two tiles, to power a machine from beyond its pipes, and its wire has to reach as far as a machine is wide.
error-chain-fuel=__1__ is made in a machine that burns fuel, but only the first step of each branch can take fuel (the fuel travels on the belt of raw items), so it cannot be generated.
error-fuel-needs-inputs=__1__ is made in a furnace that is fed by another step and needs fuel, which only the blueprint that brings in one belt of each material can supply. Research the splitter and the underground belt to generate it.
generated=Ready: __1__ __2__/min\nRaw/min: __3__
generated-with-belts=Ready: __1__ __2__/min\nRaw/min: __3__\nBelts in, top to bottom: __4__
raw-amount=__1__ __2__
